name: Build VCamKamiHook

on:
  push:
    branches: [ main ]
    paths:
      - 'vcamkamihook/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos -f clang)

          echo "SDK: $SDK_PATH"

          mkdir -p build

          # 模仿 Theos 编译方式，避免闪退
          $CLANG \
              -arch arm64 \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=12.0 \
              -fobjc-arc \
              -fmodules \
              -x objective-c \
              -framework Foundation \
              -framework UIKit \
              -lobjc \
              -install_name @rpath/VCamKamiHook.dylib \
              -flat_namespace \
              -undefined suppress \
              -dynamiclib \
              -o build/VCamKamiHook.dylib \
              vcamkamihook/tweak.x

          codesign -f -s - build/VCamKamiHook.dylib

          # Build VCamKamiMemory companion dylib
          $CLANG \
              -arch arm64 \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=12.0 \
              -fobjc-arc \
              -fmodules \
              -x objective-c \
              -framework Foundation \
              -framework UIKit \
              -lobjc \
              -install_name @rpath/VCamKamiMemory.dylib \
              -flat_namespace \
              -undefined suppress \
              -dynamiclib \
              -o build/VCamKamiMemory.dylib \
              vcamkamihook/kammem.x

          codesign -f -s - build/VCamKamiMemory.dylib
          echo "=== Build result ==="
          file build/VCamKamiHook.dylib
          file build/VCamKamiMemory.dylib
          ls -la build/

      - name: Upload VCamKamiHook
        uses: actions/upload-artifact@v4
        with:
          name: VCamKamiHook.dylib
          path: build/VCamKamiHook.dylib

      - name: Upload VCamKamiMemory
        uses: actions/upload-artifact@v4
        with:
          name: VCamKamiMemory.dylib
          path: build/VCamKamiMemory.dylib
