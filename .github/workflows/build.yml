name: Build VCamKamiHook

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos -f clang)

          echo "SDK: $SDK_PATH"

          mkdir -p build

          $CLANG \
              -arch arm64 \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=12.0 \
              -fobjc-arc \
              -fmodules \
              -x objective-c \
              -framework Foundation \
              -framework UIKit \
              -dynamiclib \
              -o build/VCamKamiHook.dylib \
              tweak.x

          codesign -f -s - build/VCamKamiHook.dylib

          echo "=== Build result ==="
          file build/VCamKamiHook.dylib
          ls -la build/VCamKamiHook.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamKamiHook.dylib
          path: build/VCamKamiHook.dylib
